name: ONPE Scrapper

on:
  schedule:
    - cron: "*/30 * * * *" # Cada 30 minutos
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check date limit
        shell: bash
        run: |
          # Si la fecha de hoy es mayor al 12 de junio, el job falla y se detiene
          if [[ "$(date +%Y-%m-%d)" > "2026-06-12" ]]; then
            echo "Límite de fecha alcanzado. Finalizando..."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run scrapper
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
        run: uv run python src/local/results.py

      - name: Upload artifact (backup local)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ github.run_id }}
          path: data/resultados/
          retention-days: 3
